name: Disparo de Notificacoes Push - FinControl

on:
  schedule:
    # Roda a cada hora (no minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite rodar manualmente para testar

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Executar script de envio
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          if [ -f "enviar_notificacoes.py" ]; then
            python enviar_notificacoes.py
          elif [ -f ".github/workflows/enviar_notificacoes.py" ]; then
            python .github/workflows/enviar_notificacoes.py
          else
            echo "Erro: Arquivo enviar_notificacoes.py nao foi encontrado!"
            exit 1
          fi
