name: Enviar Notificacoes FinControl

on:
  schedule:
    # Executa a cada hora no minuto 0 (ex: 08:00, 09:00, 10:00...)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite rodar manualmente para testar quando quiser

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar Script de Notificações
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python enviar_notificacoes.py
